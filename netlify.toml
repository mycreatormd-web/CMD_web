[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Netlify Identity: enable Git Gateway for Decap CMS
[functions]
  directory = "netlify/functions"

# Keep admin area out of search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Next.js handles all routing — remove the catch-all redirect
# that was overriding Next.js pages
